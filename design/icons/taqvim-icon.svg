<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Taqvim calendar icon</title>
  <desc id="desc">A blue calendar with a navy crescent and a golden sun.</desc>
  <defs>
    <clipPath id="calendar-shape">
      <rect x="16" y="16" width="96" height="96" rx="24" />
    </clipPath>
  </defs>

  <!-- Chrome Web Store artwork occupies 96x96 with 16px transparent padding. -->
  <g clip-path="url(#calendar-shape)">
    <rect x="16" y="16" width="96" height="96" fill="#2F6FDF" />
    <rect x="16" y="44" width="96" height="68" fill="#F7FAFF" />
    <rect x="22" y="50" width="84" height="56" rx="16" fill="#FFFFFF" />
  </g>

  <rect x="16.75" y="16.75" width="94.5" height="94.5" rx="23.25" fill="none" stroke="#194EAF" stroke-width="1.5" />

  <!-- Binding slots stay inside the artwork boundary and remain visible at 48px. -->
  <rect x="35" y="24" width="18" height="7" rx="3.5" fill="#DCEAFF" />
  <rect x="75" y="24" width="18" height="7" rx="3.5" fill="#DCEAFF" />

  <!-- The crescent and sun reference Jalali dates and Tehran time without tiny text. -->
  <circle cx="58" cy="78" r="18" fill="#173A70" />
  <circle cx="66" cy="70" r="17" fill="#FFFFFF" />
  <circle cx="84" cy="68" r="6" fill="#F7B928" />
</svg>
