<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The 300x300 store logo (Edge Add-ons recommends 300x300). Headless
         Chrome lays out narrow windows wider than asked, so the image is pinned
         at 300px in the top-left corner instead of filling the viewport. -->
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      img {
        display: block;
        width: 300px;
        height: 300px;
      }
    </style>
  </head>
  <body>
    <img src="taqvim-icon.svg" alt="" />
  </body>
</html>
