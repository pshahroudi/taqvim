<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taqvim</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand">Taqvim</div>
          <div class="sub">Persian Calendar</div>
        </div>

        <div class="actions">
          <button id="themeToggle" class="icon-btn" title="Cycle theme">
            🌓
          </button>
          <button id="openSettings" class="icon-btn" title="Open settings">
            ⚙
          </button>
        </div>
      </header>

      <section class="today-card">
        <div class="section-label">Today</div>
        <div id="todayJalali" class="jalali-date"></div>
        <div id="todayGregorian" class="gregorian-date"></div>
        <div id="todayHijri" class="hijri-date hidden"></div>
        <div id="holidayStatus" class="holiday-status">
          Holiday data comes next
        </div>
      </section>

      <section class="tabs">
        <button class="tab active" type="button">Calendar</button>
        <button class="tab muted-tab" type="button" disabled>Convert</button>
      </section>

      <section class="panel">
        <div class="panel-header">
          <button
            id="prevMonth"
            class="nav-btn"
            type="button"
            aria-label="Previous month"
          >
            ‹
          </button>

          <div class="month-group">
            <div id="monthTitle" class="month-title"></div>
            <div id="monthSubtitle" class="month-subtitle"></div>
          </div>

          <button
            id="nextMonth"
            class="nav-btn"
            type="button"
            aria-label="Next month"
          >
            ›
          </button>
        </div>

        <div class="panel-actions">
          <button id="goToday" class="today-btn" type="button">Today</button>
        </div>

        <div class="weekday-row">
          <div>Sat</div>
          <div>Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <section class="details-card">
        <div class="section-label">Selected day</div>
        <div id="selectedJalali" class="detail-primary"></div>
        <div id="selectedGregorian" class="detail-secondary"></div>
        <div id="selectedHijri" class="detail-secondary hidden"></div>
        <div id="selectedHoliday" class="detail-secondary">
          Holiday data comes next
        </div>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
