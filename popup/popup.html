<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taqvim</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand">Taqvim</div>
        <div class="sub">Persian calendar and holiday browser</div>
      </div>

      <div class="actions">
        <button id="themeToggle" class="icon-btn" title="Cycle theme" aria-label="Cycle theme">🌓</button>
        <button id="openSettings" class="icon-btn" title="Open settings" aria-label="Open settings">⚙</button>
      </div>
    </header>

    <main class="workspace">
      <section class="calendar-shell" aria-label="Calendar panel">
        <div class="controls-row">
          <div class="jump-controls">
            <label class="field field-month">
              <span class="field-label">Month</span>
              <select id="monthSelect" class="field-control field-control-fa" dir="rtl" aria-label="Persian month"></select>
            </label>

            <label class="field field-year">
              <span class="field-label">Year</span>
              <select id="yearSelect" class="field-control field-control-fa" dir="rtl" aria-label="Persian year"></select>
            </label>
          </div>

          <div class="calendar-nav" aria-label="Month navigation">
            <button id="prevMonth" class="nav-btn" type="button" aria-label="Previous month">‹</button>
            <button id="goToday" class="today-btn" type="button">Today</button>
            <button id="nextMonth" class="nav-btn" type="button" aria-label="Next month">›</button>
          </div>
        </div>

        <div id="weekdayRow" class="weekday-row" role="row"></div>
        <div id="calendarGrid" class="calendar-grid" role="grid" aria-label="Calendar month"></div>
      </section>

      <aside class="sidebar-shell">
        <section class="time-card" aria-label="Tehran local time">
          <div class="time-card-label">Tehran time</div>
          <div class="time-card-main">
            <div id="tehranTime" class="tehran-time-value ltr-text">--:--</div>
            <div id="tehranDate" class="tehran-time-date ltr-text">Asia/Tehran</div>
          </div>
        </section>

        <section class="side-card today-card">
          <div class="section-label">Today</div>
          <div class="date-stack">
            <div id="todayJalali" class="jalali-date rtl-text" lang="fa" dir="rtl"></div>
            <div id="todayGregorian" class="gregorian-date ltr-text" lang="en" dir="ltr"></div>
            <div id="todayHijri" class="hijri-date ltr-text hidden" lang="en" dir="ltr"></div>
          </div>

          <div class="holiday-panel compact-panel">
            <div id="todayHolidayStatus" class="status-line ltr-text">Loading…</div>
            <div id="todayHolidayChips" class="chip-row hidden" lang="fa" dir="rtl"></div>
          </div>
        </section>

        <section class="side-card details-card">
          <div class="section-label">Selected day</div>

          <div class="details-scroll">
            <div class="date-stack">
              <div id="selectedJalali" class="detail-primary rtl-text" lang="fa" dir="rtl"></div>
              <div id="selectedGregorian" class="detail-secondary ltr-text" lang="en" dir="ltr"></div>
              <div id="selectedHijri" class="detail-secondary ltr-text hidden" lang="en" dir="ltr"></div>
            </div>

            <div class="holiday-panel holiday-panel-selected">
              <div id="selectedHolidayStatus" class="status-line ltr-text">Loading…</div>
              <div id="selectedHolidayChips" class="chip-row hidden" lang="fa" dir="rtl"></div>
              <div id="selectedHolidayList" class="holiday-list hidden"></div>
            </div>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
