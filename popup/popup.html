<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taqvim</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-topbar">
        <nav class="tab-bar" role="tablist" aria-label="Taqvim views">
          <button
            id="calendarTab"
            class="tab-btn active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="calendarPanel"
          >
            Calendar
          </button>
          <button
            id="convertTab"
            class="tab-btn"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="convertPanel"
          >
            Convert
          </button>
        </nav>

        <div class="compact-head-actions" aria-label="Popup actions">
          <button
            id="fontSizeToggle"
            class="utility-btn font-size-toggle"
            title="Font size: medium"
            aria-label="Font size: medium"
            type="button"
          >
            <span
              id="fontSizeToggleIcon"
              class="utility-icon font-size-icon"
              aria-hidden="true"
              >A</span
            >
            <span class="utility-label">Font size</span>
          </button>
          <button
            id="themeToggle"
            class="utility-btn"
            title="Cycle theme"
            aria-label="Theme: system"
            type="button"
          >
            <span id="themeToggleIcon" class="utility-icon" aria-hidden="true"
              >◐</span
            >
            <span class="utility-label">Theme</span>
          </button>
          <button
            id="openSettings"
            class="utility-btn"
            title="Open settings"
            aria-label="Open settings"
            type="button"
          >
            <span class="utility-icon" aria-hidden="true">⚙</span>
            <span class="utility-label">Settings</span>
          </button>
        </div>
      </header>

      <main
        id="calendarPanel"
        class="workspace workspace-two-column tab-panel"
        role="tabpanel"
        aria-labelledby="calendarTab"
      >
        <section class="calendar-shell" aria-label="Calendar panel">
          <div class="controls-row">
            <div class="date-picker-anchor">
              <button
                id="datePickerToggle"
                class="date-picker-toggle"
                type="button"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="miniDatePicker"
              >
                <span class="date-picker-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="4" y="5" width="16" height="15" rx="3"></rect>
                    <path d="M8 3v4M16 3v4M4 10h16"></path>
                  </svg>
                </span>
                <span class="date-picker-copy">
                  <span class="date-picker-label rtl-text" lang="fa" dir="rtl"
                    >پرش به تاریخ</span
                  >

                  <span
                    id="datePickerMeta"
                    class="date-picker-meta ltr-text"
                    lang="en"
                    dir="ltr"
                  ></span>
                </span>
                <!-- <span class="date-picker-caret" aria-hidden="true">⌄</span> -->
              </button>
            </div>

            <div class="calendar-nav" aria-label="Month navigation">
              <button
                id="prevMonth"
                class="nav-btn"
                type="button"
                aria-label="Previous month"
              >
                ‹
              </button>
              <button id="goToday" class="today-btn" type="button">
                <span class="today-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="4" y="5" width="16" height="15" rx="3"></rect>
                    <path d="M8 3v4M16 3v4M4 10h16"></path>
                  </svg>
                </span>
                <span lang="fa" dir="rtl">امروز</span>
              </button>
              <button
                id="nextMonth"
                class="nav-btn"
                type="button"
                aria-label="Next month"
              >
                ›
              </button>
            </div>

            <div
              id="miniDatePicker"
              class="mini-picker jump-picker hidden"
              role="dialog"
              aria-label="Jump to Jalali date"
            >
              <div class="mini-picker-top">
                <div class="mini-picker-head">
                  <div class="mini-picker-brand">
                    <span class="mini-picker-icon" aria-hidden="true">🗓</span>
                    <div class="mini-picker-heading">
                      <div class="mini-picker-eyebrow">Jump to date</div>
                      <div class="mini-picker-helper">
                        Choose a Jalali year, month, and day.
                      </div>
                    </div>
                  </div>
                  <button
                    id="miniPickerClose"
                    class="mini-close-btn"
                    type="button"
                    aria-label="Close date picker"
                  >
                    ✕
                  </button>
                </div>
              </div>

              <form id="jumpDateForm" class="jump-date-form">
                <div class="jump-form-card">
                  <div class="jump-form-section">
                    <div class="jump-section-label">Date details</div>
                    <div class="jump-field-grid">
                      <label class="jump-field jump-field-year">
                        <span class="jump-field-label">Year</span>
                        <input
                          id="jumpYearInput"
                          class="jump-input rtl-text"
                          type="text"
                          inputmode="numeric"
                          pattern="[0-9۰-۹٠-٩]*"
                          lang="fa"
                          dir="rtl"
                          autocomplete="off"
                        />
                      </label>

                      <label class="jump-field jump-field-month">
                        <span class="jump-field-label">Month</span>
                        <select
                          id="jumpMonthSelect"
                          class="jump-select rtl-text"
                          lang="fa"
                          dir="rtl"
                        ></select>
                      </label>

                      <label class="jump-field jump-field-day">
                        <span class="jump-field-label">Day</span>
                        <select id="jumpDaySelect" class="jump-select"></select>
                      </label>
                    </div>
                  </div>

                  <div
                    id="jumpDateError"
                    class="jump-date-error hidden"
                    role="alert"
                  ></div>

                  <div class="jump-form-section">
                    <div class="jump-section-label">Preview</div>
                    <div class="jump-date-preview" aria-live="polite">
                      <div
                        id="jumpDatePreviewJalali"
                        class="jump-preview-primary rtl-text"
                        lang="fa"
                        dir="rtl"
                      ></div>
                      <div
                        id="jumpDatePreviewGregorian"
                        class="jump-preview-secondary ltr-text"
                        lang="en"
                        dir="ltr"
                      ></div>
                    </div>
                  </div>
                </div>

                <div class="mini-picker-actions jump-picker-actions">
                  <button id="miniGoToday" class="mini-today-btn" type="button">
                    امروز
                  </button>
                  <button id="jumpDateGo" class="jump-go-btn" type="submit">
                    برو
                  </button>
                </div>
              </form>
            </div>
          </div>

          <div class="weekday-strip">
            <div class="calendar-month-header">
              <span
                id="datePickerValue"
                class="date-picker-value rtl-text"
                lang="fa"
                dir="rtl"
              ></span>
            </div>
            <div id="weekdayRow" class="weekday-row" role="row"></div>
          </div>
          <div
            id="calendarGrid"
            class="calendar-grid"
            role="grid"
            aria-label="Calendar month"
          ></div>
        </section>

        <aside class="sidebar-shell">
          <section
            class="side-card side-card-tehran"
            aria-label="Tehran local time and date"
          >
            <div class="section-label section-label-tight">
              زمان به وقت تهران
            </div>
            <div class="selected-date-divider" aria-hidden="true"></div>
            <div class="tehran-row">
              <div class="tehran-time-block">
                <span
                  id="tehranPhaseIcon"
                  class="tehran-phase-icon"
                  aria-hidden="true"
                  >☀</span
                >
                <div id="tehranTime" class="topbar-tehran-time ltr-text">
                  --:--
                </div>
              </div>
              <div class="selected-date-divider" aria-hidden="true"></div>
              <div class="tehran-copy-block">
                <div
                  id="tehranPersianDate"
                  class="topbar-tehran-persian rtl-text"
                  lang="fa"
                  dir="rtl"
                ></div>
                <div id="tehranDate" class="topbar-tehran-date">
                  Asia/Tehran
                </div>
              </div>
            </div>
          </section>

          <section
            class="side-card merged-side-card"
            aria-label="Selected day details"
          >
            <div class="selected-day-shell">
              <div class="detail-surface detail-surface-selected">
                <div class="date-stack">
                  <div class="selected-day-title" lang="fa" dir="rtl">
                    روز انتخاب شده
                  </div>
                  <div class="selected-date-divider" aria-hidden="true"></div>
                  <div
                    id="selectedJalali"
                    class="detail-primary rtl-text"
                    lang="fa"
                    dir="rtl"
                  ></div>

                  <div class="selected-date-divider" aria-hidden="true"></div>

                  <div
                    id="selectedHijri"
                    class="detail-secondary ltr-text hidden"
                    lang="en"
                    dir="ltr"
                  ></div>

                  <div
                    id="selectedHolidayStatus"
                    class="selected-holiday-status rtl-text"
                    lang="fa"
                    dir="rtl"
                  >
                    Loading…
                  </div>

                  <div
                    id="selectedHolidayChips"
                    class="chip-row hidden"
                    lang="fa"
                    dir="rtl"
                  ></div>
                  <div
                    id="selectedHolidayList"
                    class="selected-holiday-status rtl-text hidden"
                  ></div>
                  <div class="selected-date-divider" aria-hidden="true"></div>
                  <div
                    id="selectedGregorian"
                    class="detail-secondary ltr-text"
                    lang="en"
                    dir="ltr"
                  ></div>
                </div>
              </div>

              <!-- <div class="selected-status-card">
                <div
                  id="selectedHolidayStatus"
                  class="selected-holiday-status rtl-text"
                  lang="fa"
                  dir="rtl"
                >
                  Loading…
                </div>

                <div
                  id="selectedHolidayChips"
                  class="chip-row hidden"
                  lang="fa"
                  dir="rtl"
                ></div>
                <div id="selectedHolidayList" class="holiday-list hidden"></div>
              </div> -->
            </div>

            <div class="today-data-cache hidden" aria-hidden="true">
              <div id="todayJalali"></div>
              <div id="todayGregorian"></div>
              <div id="todayHijri" class="hidden"></div>
              <div id="todayHolidayStatus"></div>
              <div id="todayHolidayChips" class="hidden"></div>
            </div>
          </section>
        </aside>
      </main>

      <section
        id="convertPanel"
        class="convert-shell tab-panel hidden"
        role="tabpanel"
        aria-labelledby="convertTab"
      >
        <div class="convert-card">
          <div class="convert-head">
            <div>
              <div class="section-label">Date converter</div>
              <h1 lang="fa" dir="rtl">تبدیل تاریخ</h1>
            </div>
          </div>

          <div class="convert-grid">
            <label class="convert-field">
              <span>Source calendar</span>
              <select id="convertSource">
                <option value="jalali">Jalali</option>
                <option value="gregorian">Gregorian</option>
                <option value="hijri">Hijri</option>
              </select>
            </label>

            <label class="convert-field">
              <span>Year</span>
              <input
                id="convertYear"
                type="number"
                inputmode="numeric"
                min="1"
              />
            </label>

            <label class="convert-field">
              <span>Month</span>
              <input
                id="convertMonth"
                type="number"
                inputmode="numeric"
                min="1"
                max="12"
              />
            </label>

            <label class="convert-field">
              <span>Day</span>
              <input
                id="convertDay"
                type="number"
                inputmode="numeric"
                min="1"
                max="31"
              />
            </label>
          </div>

          <div
            id="convertError"
            class="convert-error hidden"
            role="status"
            aria-live="polite"
          ></div>

          <div class="convert-results" aria-live="polite">
            <div class="convert-result-row">
              <div>
                <span class="convert-result-label">Jalali</span>
                <strong id="convertJalali" class="rtl-text" lang="fa" dir="rtl"
                  >--</strong
                >
              </div>
              <button
                class="copy-btn"
                type="button"
                data-copy-target="convertJalali"
                aria-label="Copy Jalali date"
              >
                Copy
              </button>
            </div>

            <div class="convert-result-row">
              <div>
                <span class="convert-result-label">Gregorian</span>
                <strong
                  id="convertGregorian"
                  class="ltr-text"
                  lang="en"
                  dir="ltr"
                  >--</strong
                >
              </div>
              <button
                class="copy-btn"
                type="button"
                data-copy-target="convertGregorian"
                aria-label="Copy Gregorian date"
              >
                Copy
              </button>
            </div>

            <div class="convert-result-row">
              <div>
                <span class="convert-result-label">Hijri</span>
                <strong id="convertHijri" class="ltr-text" lang="en" dir="ltr"
                  >--</strong
                >
              </div>
              <button
                class="copy-btn"
                type="button"
                data-copy-target="convertHijri"
                aria-label="Copy Hijri date"
              >
                Copy
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
