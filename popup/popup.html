<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taqvim</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-shell">
    <main class="workspace workspace-two-column">
      <section class="calendar-shell" aria-label="Calendar panel">
        <div class="controls-row">
          <div class="date-picker-anchor">
            <button
              id="datePickerToggle"
              class="date-picker-toggle"
              type="button"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="miniDatePicker"
            >
              <span class="date-picker-copy">
                <span class="date-picker-label">Jump to date</span>
                <span id="datePickerValue" class="date-picker-value rtl-text" lang="fa" dir="rtl"></span>
                <span id="datePickerMeta" class="date-picker-meta ltr-text" lang="en" dir="ltr"></span>
              </span>
              <span class="date-picker-caret" aria-hidden="true">▾</span>
            </button>

            <div id="miniDatePicker" class="mini-picker hidden" role="dialog" aria-label="Select a date">
              <div class="mini-picker-top">
                <div class="mini-picker-eyebrow">Select a day</div>
                <button id="miniPickerClose" class="mini-close-btn" type="button" aria-label="Close date picker">✕</button>
              </div>

              <div class="mini-picker-nav">
                <button id="miniPrevMonth" class="mini-nav-btn" type="button" aria-label="Previous month">‹</button>
                <div class="mini-picker-title-wrap">
                  <div id="miniPickerTitle" class="mini-picker-title rtl-text" lang="fa" dir="rtl"></div>
                  <div id="miniPickerSubtitle" class="mini-picker-subtitle ltr-text" lang="en" dir="ltr"></div>
                </div>
                <button id="miniNextMonth" class="mini-nav-btn" type="button" aria-label="Next month">›</button>
              </div>

              <div id="miniWeekdayRow" class="mini-weekday-row" role="row"></div>
              <div id="miniCalendarGrid" class="mini-calendar-grid" role="grid" aria-label="Mini calendar"></div>

              <div class="mini-picker-actions">
                <button id="miniGoToday" class="mini-today-btn" type="button">Go to today</button>
              </div>
            </div>
          </div>

          <div class="calendar-nav" aria-label="Month navigation">
            <button id="prevMonth" class="nav-btn" type="button" aria-label="Previous month">‹</button>
            <button id="goToday" class="today-btn" type="button">Today</button>
            <button id="nextMonth" class="nav-btn" type="button" aria-label="Next month">›</button>
          </div>

          <div class="compact-head-actions" aria-label="Popup actions">
            <button id="themeToggle" class="icon-btn" title="Cycle theme" aria-label="Cycle theme">◐</button>
            <button id="openSettings" class="icon-btn" title="Open settings" aria-label="Open settings">⚙</button>
          </div>
        </div>

        <div class="weekday-strip">
          <div id="weekdayRow" class="weekday-row" role="row"></div>
        </div>
        <div id="calendarGrid" class="calendar-grid" role="grid" aria-label="Calendar month"></div>
      </section>

      <aside class="sidebar-shell">
        <section class="side-card side-card-tehran" aria-label="Tehran local time and date">
          <div class="section-label section-label-tight">Tehran now</div>

          <div class="tehran-row">
            <div class="tehran-time-block">
              <span id="tehranPhaseIcon" class="tehran-phase-icon" aria-hidden="true">☀</span>
              <div id="tehranTime" class="topbar-tehran-time ltr-text">--:--</div>
            </div>
            <div class="tehran-copy-block">
              <div id="tehranDate" class="topbar-tehran-date ltr-text">Asia/Tehran</div>
              <div id="tehranPersianDate" class="topbar-tehran-persian rtl-text" lang="fa" dir="rtl"></div>
            </div>
          </div>
        </section>

        <section class="side-card merged-side-card" aria-label="Selected day details">
          <div class="section-label">Selected day</div>

          <div class="detail-surface">
            <div class="date-stack">
              <div id="selectedJalali" class="detail-primary rtl-text" lang="fa" dir="rtl"></div>
              <div id="selectedGregorian" class="detail-secondary ltr-text" lang="en" dir="ltr"></div>
              <div id="selectedHijri" class="detail-secondary ltr-text hidden" lang="en" dir="ltr"></div>
            </div>
          </div>

          <div class="status-card">
            <div id="selectedHolidayStatus" class="status-line ltr-text">Loading…</div>
          </div>

          <div id="selectedHolidayChips" class="chip-row hidden" lang="fa" dir="rtl"></div>
          <div id="selectedHolidayList" class="holiday-list hidden"></div>

          <div class="today-data-cache hidden" aria-hidden="true">
            <div id="todayJalali"></div>
            <div id="todayGregorian"></div>
            <div id="todayHijri" class="hidden"></div>
            <div id="todayHolidayStatus"></div>
            <div id="todayHolidayChips" class="hidden"></div>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
