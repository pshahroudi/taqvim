name: Quality and release package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Run smoke and unit tests
        run: npm run check

      - name: Build Chrome Web Store archive
        run: npm run package

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: taqvim-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
